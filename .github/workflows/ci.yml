name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'build.rs', 'src') }}

      - name: Fetch ODPI-C
        run: ./setup.sh

      - name: Clippy (informational)
        run: cargo clippy --release
        continue-on-error: true

      - name: Build
        run: cargo build --release

      - name: Smoke (usage banner)
        run: ./target/release/chcsv 2>&1 | grep -q 'Batayan'
